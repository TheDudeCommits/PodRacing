<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-labelledby="title desc">
  <title id="title">Original fork advance route key, front view</title>
  <desc id="desc">One shared approach splits toward a cyan raised bridge and a wider cream main road. The bridge key has a deck with two piers; the main-road key has two open parallel lane strokes. This is a source icon drawing, not a game capture or acceptance image.</desc>
  <rect width="640" height="530" fill="#eee2cb"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#263242">FORK ADVANCE KEY · SOURCE ARTWORK</text>
  <rect x="60" y="55" width="520" height="370" rx="1" fill="#34404b" stroke="#a88b6e" stroke-width="10"/>
  <rect x="74" y="69" width="492" height="342" fill="#1e2431"/>
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M320 356 L320 301 L378 255 L445 192 L445 140" stroke="#f0d6a5" stroke-width="26"/>
    <path d="M320 301 L262 255 L195 192 L195 140" stroke="#66c9c2" stroke-width="23"/>
    <path d="M414 174 L445 140 L476 174" stroke="#f0d6a5" stroke-width="18"/>
    <path d="M164 174 L195 140 L226 174" stroke="#66c9c2" stroke-width="18"/>
    <path d="M163 123 V94 H227 V123 M155 91 H235" stroke="#66c9c2" stroke-width="8"/>
    <path d="M430 86 V122 M460 86 V122" stroke="#f0d6a5" stroke-width="8"/>
  </g>
  <text x="195" y="455" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#263242">BRIDGE</text>
  <text x="445" y="455" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#263242">MAIN ROAD</text>
  <text x="320" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#536172">Runtime uses colored solid geometry; no texture or canvas.</text>
  <text x="320" y="513" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#536172">Direction derives from the actual road and bridge. Labels here are editorial.</text>
</svg>
