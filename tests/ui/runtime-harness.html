<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podracing HUD Review Harness</title>
    <style>
      html, body, #hud-stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #201631; }
      #hud-stage {
        position: relative;
        background:
          radial-gradient(circle at 77% 20%, #fff4ad 0 1.2%, #f29550 1.35% 1.7%, transparent 1.9%),
          radial-gradient(circle at 84% 25%, #fff4ad 0 0.7%, #ef694d 0.85% 1.1%, transparent 1.3%),
          linear-gradient(#48458a 0 46%, #ef8550 46% 56%, #d66b43 56% 61%, #b9573c 61% 100%);
      }
      #hud-stage::before {
        content: "";
        position: absolute;
        left: -5%; right: -5%; bottom: -20%; height: 60%;
        background: #e2a254;
        clip-path: polygon(0 48%, 14% 30%, 28% 44%, 44% 18%, 62% 36%, 78% 9%, 100% 28%, 100% 100%, 0 100%);
      }
      #hud-stage::after {
        content: "";
        position: absolute;
        left: 28%; bottom: 10%; width: 48%; height: 18%;
        background: #4d2635;
        border: 8px solid #130c1b;
        clip-path: polygon(0 60%, 19% 24%, 45% 40%, 58% 0, 78% 33%, 100% 47%, 91% 100%, 10% 100%);
        transform: perspective(500px) rotateX(58deg);
      }
    </style>
  </head>
  <body>
    <main id="hud-stage"></main>
    <script type="module" src="./runtimeHarness.ts"></script>
  </body>
</html>
